name: Paper Pipeline

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'results/**'
      - 'tools/paper/**'
      - 'paper/**'
  pull_request:
    branches: [ main ]
    paths:
      - 'results/**'
      - 'tools/paper/**'
      - 'paper/**'
  workflow_dispatch:   # allow manual trigger

jobs:
  generate-assets:
    name: Generate LaTeX assets
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install optional Python dependencies
        run: pip install pandas numpy || true   # optional; generator works without them

      - name: Run asset generator
        run: python3 tools/paper/generate_paper_assets.py

      - name: Check generated files exist
        run: |
          for f in \
            paper/tables/sim_config.tex \
            paper/tables/handover_kpi.tex \
            paper/tables/mec_kpi.tex \
            paper/tables/ml_summary.tex \
            paper/figures/latency_cdf.tex \
            paper/figures/throughput_vs_load.tex \
            paper/figures/rsrp_timeseries.tex \
            paper/sections/auto_results.tex; do
            if [ ! -f "$f" ]; then
              echo "MISSING: $f"
              exit 1
            else
              echo "OK: $f"
            fi
          done

      - name: Syntax-check generated .tex files
        run: |
          # Use Python to do a basic UTF-8 read check on every generated file
          python3 - <<'EOF'
          import glob, sys
          failed = []
          for path in glob.glob("paper/**/*.tex", recursive=True):
              try:
                  with open(path, encoding="utf-8") as f:
                      content = f.read()
                  # Check balanced braces (simple heuristic)
                  depth = 0
                  for ch in content:
                      if ch == '{': depth += 1
                      elif ch == '}': depth -= 1
                  if depth != 0:
                      failed.append(f"{path}: unbalanced braces (depth={depth})")
              except Exception as e:
                  failed.append(f"{path}: {e}")
          if failed:
              print("Syntax check failures:")
              for f in failed:
                  print(" ", f)
              sys.exit(1)
          print(f"All {len(list(glob.glob('paper/**/*.tex', recursive=True)))} .tex files passed syntax check.")
          EOF

      - name: Upload generated assets
        uses: actions/upload-artifact@v3
        with:
          name: paper-assets
          path: |
            paper/tables/
            paper/figures/
            paper/sections/auto_results.tex
          retention-days: 7

  compile-latex:
    name: Compile LaTeX paper
    runs-on: ubuntu-latest
    needs: generate-assets
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Python dependencies
        run: pip install pandas numpy || true

      - name: Generate assets
        run: python3 tools/paper/generate_paper_assets.py

      - name: Install LaTeX
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            texlive-base texlive-latex-extra texlive-science \
            texlive-fonts-recommended latexmk

      - name: Compile PDF
        run: |
          cd paper
          latexmk -pdf -interaction=nonstopmode -halt-on-error main.tex

      - name: Upload compiled PDF
        uses: actions/upload-artifact@v3
        with:
          name: paper-pdf
          path: paper/main.pdf
          retention-days: 30
